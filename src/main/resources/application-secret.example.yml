# ============================================================
# 密钥配置模板
# 使用方法：复制本文件为 application-secret.yml，并填入真实值
#   cp src/main/resources/application-secret.example.yml src/main/resources/application-secret.yml
# application-secret.yml 已被 .gitignore 忽略，不会提交到远程仓库
# ============================================================
secrets:
  # MySQL 数据库密码
  mysql-password: 请填写你的MySQL密码

  # DeepSeek（OpenAI 兼容接口）API Key
  deepseek-api-key: 请填写你的DeepSeek-API-Key

  # 阿里云百炼 / 通义千问 DashScope API Key（embedding、流式对话、qwen 共用）
  dashscope-api-key: 请填写你的DashScope-API-Key

  # Pinecone 向量库 API Key
  pinecone-api-key: 请填写你的Pinecone-API-Key
