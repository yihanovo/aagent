server:
  port: 8080

spring:
  # 密钥配置双通道（均为 optional，缺文件不阻断启动）：
  #  - classpath：开发期（IDE / 源码运行），读取 src/main/resources/application-secret.yml
  #  - file:./config/：生产期（fat jar），密钥文件已被打包排除，从 jar 同级 config/ 目录读取
  # 两处都存在时，file:./config/ 优先生效
  config:
    import: optional:classpath:application-secret.yml;optional:file:./config/application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${secrets.mysql-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      # 本项目专用容器 ai-langchain4j-mongo：宿主机 27018 -> 容器 27017
      # 对话记忆独立放在 ai_chat_memory 库，避免和本机 27017 的 MongoDB 服务、mall 项目数据混在一起
      uri: mongodb://localhost:27018/ai_chat_memory

langchain4j:
  # OpenAI 兼容接口（deepseek 等），由 langchain4j-open-ai-spring-boot-starter 读取
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${secrets.deepseek-api-key}
      model-name: deepseek-v4-flash
      temperature: 0.9
      # 关闭请求/响应日志：开启会把用户姓名、身份证等 PII 明文写进日志
      log-requests: false
      log-responses: false
  community:
    dashscope:
      embedding-model:
        api-key: ${secrets.dashscope-api-key}
        model-name: text-embedding-v3
      streaming-chat-model:
        api-key: ${secrets.dashscope-api-key}
        model-name: qwen-plus

# 阿里云百炼业务空间专属域名只提供 OpenAI 兼容接口。
# 供 LLMTest / RAGTest 通过 @Value 引用（自定义 OpenAI 兼容端点）；
# 真实密钥统一由 application-secret.yml 的 secrets.dashscope-api-key 提供，此处不写明文。
qwen:
  base-url: https://llm-ln8twdgnh2cfidt1.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api-key: ${secrets.dashscope-api-key}
  model-name: qwen3.8-flash

logging:
  level:
    root: info
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
